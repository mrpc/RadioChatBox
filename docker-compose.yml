services:
  apache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radiochatbox_apache
    restart: on-failure
    ports:
      - "98:80"
    volumes:
      - ./:/var/www/html
      - ./apache/site.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=radiochatbox
      - DB_USER=radiochatbox
      - DB_PASSWORD=radiochatbox_secret
      - TZ=Europe/Athens
    depends_on:
      - redis
      - postgres
    networks:
      - radiochatbox

  # The background worker: bot replies and the periodic tasks (stats, cleanup, track
  # polling). It is its own service so Docker restarts it - which is also what makes
  # the code-change reload work, since PHP cannot reload code into a running process
  # and the worker has to be replaced by a fresh one.
  #
  # Add --schedule to the command to move the crontab jobs in here (see
  # docs/BOT_REPLIES.md); without it the worker only delivers bot replies.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radiochatbox_worker
    restart: unless-stopped
    command: php /var/www/html/bot-worker.php run --sleep=1
    volumes:
      - ./:/var/www/html
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=radiochatbox
      - DB_USER=radiochatbox
      - DB_PASSWORD=radiochatbox_secret
      - TZ=Europe/Athens
      # Tells the worker something will restart it, so a code change is a clean exit
      # rather than a self-respawn.
      - WORKER_SUPERVISED=docker
    depends_on:
      - redis
      - postgres
    networks:
      - radiochatbox

  redis:
    image: redis:7-alpine
    container_name: radiochatbox_redis
    restart: on-failure
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - radiochatbox

  postgres:
    image: postgres:16-alpine
    container_name: radiochatbox_postgres
    restart: on-failure
    environment:
      - POSTGRES_DB=radiochatbox
      - POSTGRES_USER=radiochatbox
      - POSTGRES_PASSWORD=radiochatbox_secret
      - TZ=Europe/Athens
      - PGTZ=Europe/Athens
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    networks:
      - radiochatbox

networks:
  radiochatbox:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
