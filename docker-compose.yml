services:
  apache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radiochatbox_apache
    restart: on-failure
    ports:
      - "98:80"
    volumes:
      - ./:/var/www/html
      - ./apache/site.conf:/etc/apache2/sites-available/000-default.conf
      # Dev/test: resolve the Composer path-repo symlink
      # (vendor/mrpc/pramnosframework -> ../../../PramnosFramework => /var/www/PramnosFramework).
      # Production framework packaging is a separate, deferred decision
      # (see docs/pramnos-migration/00-overview-and-bc-strategy.md).
      - ../PramnosFramework:/var/www/PramnosFramework:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=radiochatbox
      - DB_USER=radiochatbox
      - DB_PASSWORD=radiochatbox_secret
      - TZ=Europe/Athens
    depends_on:
      - redis
      - postgres
    networks:
      - radiochatbox

  redis:
    image: redis:7-alpine
    container_name: radiochatbox_redis
    restart: on-failure
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - radiochatbox

  postgres:
    image: postgres:16-alpine
    container_name: radiochatbox_postgres
    restart: on-failure
    environment:
      - POSTGRES_DB=radiochatbox
      - POSTGRES_USER=radiochatbox
      - POSTGRES_PASSWORD=radiochatbox_secret
      - TZ=Europe/Athens
      - PGTZ=Europe/Athens
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is built by the tracked migration runner (a fresh DB is empty until
      # `./radiochatbox migrate` runs — the test bootstrap and app do this). The
      # former init.sql / migrations init-mounts were removed with the SQL squash.
    networks:
      - radiochatbox

  adminer:
    image: adminer:latest
    container_name: radiochatbox_adminer
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - TZ=Europe/Athens
    depends_on:
      - postgres
    networks:
      - radiochatbox

networks:
  radiochatbox:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
