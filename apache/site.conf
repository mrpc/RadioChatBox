<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Set DirectoryIndex to prioritize index.php
    DirectoryIndex index.php index.html

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # API front controller (migration Phase 6, strangler pattern): any /api/*
    # request that does NOT map to an existing file/dir is served by the dispatcher
    # (REQUEST_URI preserved, so the framework router sees the real path). Existing
    # legacy /api/*.php files are served directly. Migrated endpoints use clean
    # paths (e.g. /api/status) handled by attribute-routed controllers.
    # The entire /api/* surface is now framework-routed through _dispatch.php
    # (controllers in src/Controllers). public/api/ is kept as an empty dir
    # (.gitkeep) because this <Directory> FallbackResource only applies when
    # the directory must exist for this FallbackResource to match.
    <Directory /var/www/html/public/api>
        FallbackResource /_dispatch.php
    </Directory>

    # Enable mod_rewrite
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Pass Authorization header to PHP
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    </IfModule>

    # PHP settings for SSE (Server-Sent Events)
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
        
        # Disable buffering for SSE
        php_flag output_buffering Off
        php_flag implicit_flush On
        
        # Increase timeouts for long-running SSE connections
        php_value max_execution_time 3600
    </FilesMatch>

    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/json
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xml+rss
        AddOutputFilterByType DEFLATE text/javascript
    </IfModule>

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>

    # Deny access to hidden files
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Timeout settings for SSE
    Timeout 3600
    KeepAlive On
    KeepAliveTimeout 3600
    MaxKeepAliveRequests 1000
</VirtualHost>
