<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Minimal vhost: all routing, compression, security headers and dotfile
    # protection live in public/.htaccess, so the Docker dev server exercises the
    # SAME configuration as a shared-hosting deployment. AllowOverride All lets
    # that .htaccess take effect. (SSE output-buffering + max_execution_time are
    # handled in PHP by the framework StreamedResponse — no vhost php_flag needed.)
    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging (vhost-scope; a shared host manages its own logs).
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Long-lived SSE connections (server-scope; cannot go in .htaccess). Dev
    # comfort only — in production, SseWriter's max-runtime reconnect keeps
    # connections under whatever edge/proxy timeout the host enforces.
    Timeout 3600
    KeepAlive On
    KeepAliveTimeout 3600
    MaxKeepAliveRequests 1000
</VirtualHost>
